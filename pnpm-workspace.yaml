packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@nestjs/core': set this to true or false
  '@scarf/scarf': set this to true or false
  bcrypt: set this to true or false

onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - "@prisma/engines"
  - prisma
  - "@nestjs/core"
  - "@scarf/scarf"
  - bcrypt
